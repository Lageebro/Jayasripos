<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaya Sri — Machine Operator Dashboard</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Logo.png">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js for Local Storage -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden flex flex-col min-h-[660px]">
    
    <!-- Top Header -->
    <header class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 p-6 text-white text-center relative flex-shrink-0 border-b border-slate-800">
      <div class="w-14 h-14 rounded-2xl bg-slate-800/90 border border-slate-700/80 flex items-center justify-center shadow-lg shadow-brand-500/20 mx-auto mb-3 pulse-glow overflow-hidden p-1.5">
        <img src="Logo.png" alt="Jaya Sri Logo" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
        <i class="fa-solid fa-mobile-screen-button text-brand-400"></i> Operator Dashboard
      </h1>
      <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block mt-0.5">Jaya Sri Ice Cream Cone Factory</span>
    </header>

    <!-- Main Entry Form -->
    <form id="operator-form" onsubmit="submitOperatorLog(event)" class="p-6 space-y-6 flex-1 overflow-y-auto">
      
      <!-- 1. Operator Selection -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-user text-brand-500"></i> Operator Name
        </label>
        <select id="op-worker-id" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-slate-50/50 text-slate-800 font-bold text-sm">
          <option value="">Choose your name...</option>
          <!-- Filled dynamically -->
        </select>
      </div>

      <!-- 2. Date Selection -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-day text-brand-500"></i> Log Date
        </label>
        <input type="date" id="op-date" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-slate-50/50 text-slate-800 font-semibold text-sm">
      </div>

      <!-- 3. Machine selection cards -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-desktop text-brand-500"></i> Machine Used
        </label>
        <div class="grid grid-cols-3 gap-2.5">
          
          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition-all select-none bg-slate-50/50 text-slate-700 active:scale-95 shadow-sm" id="label-mach-01">
            <input type="radio" name="machineId" value="machine_01" required onclick="selectMachine('machine_01')" class="sr-only">
            <i class="fa-solid fa-microchip text-lg mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">Jaya Sri 1.48</span>
          </label>

          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition-all select-none bg-slate-50/50 text-slate-700 active:scale-95 shadow-sm" id="label-mach-02">
            <input type="radio" name="machineId" value="machine_02" onclick="selectMachine('machine_02')" class="sr-only">
            <i class="fa-solid fa-microchip text-lg mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">Jaya Sri 2.60</span>
          </label>

          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition-all select-none bg-slate-50/50 text-slate-700 active:scale-95 shadow-sm" id="label-mach-03">
            <input type="radio" name="machineId" value="machine_03" onclick="selectMachine('machine_03')" class="sr-only">
            <i class="fa-solid fa-microchip text-lg mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">MRW 3.44</span>
          </label>

        </div>
      </div>

      <!-- 4. Boxes produced input -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-box-open text-brand-500"></i> Boxes Produced
        </label>
        <div class="flex items-center shadow-sm rounded-2xl overflow-hidden">
          <button type="button" onclick="adjustBoxes(-1)" class="w-12 h-12 bg-slate-100 border border-slate-200 text-slate-600 font-black text-lg active:bg-slate-200 flex items-center justify-center transition-all"><i class="fa-solid fa-minus"></i></button>
          <input type="number" id="op-boxes" required min="1" oninput="triggerLiveCalculations()" class="w-full h-12 border-y border-slate-200 text-center font-black text-slate-900 text-xl focus:outline-none bg-slate-50/50" placeholder="Enter boxes count">
          <button type="button" onclick="adjustBoxes(1)" class="w-12 h-12 bg-slate-100 border border-slate-200 text-slate-600 font-black text-lg active:bg-slate-200 flex items-center justify-center transition-all"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <!-- 5. Mixers count selector (1-7) -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-blender text-brand-500"></i> Mixers Used
        </label>
        <div class="grid grid-cols-7 gap-1.5" id="mixers-grid">
          <!-- 1 to 7 select keys -->
        </div>
        <input type="hidden" id="op-mixers" required>
      </div>

      <!-- 6. Real-time estimated wage visual preview -->
      <div id="live-wage-preview" class="p-4 bg-gradient-to-r from-blue-500/10 via-brand-500/10 to-indigo-500/10 border border-brand-200/80 rounded-2xl text-center space-y-1 hidden shadow-sm">
        <span class="text-2xs font-extrabold text-brand-700 uppercase tracking-widest block">Calculated Estimated Wage</span>
        <h4 id="live-wage-amount" class="text-2xl font-black text-slate-900">0 LKR</h4>
        <span id="live-wage-info" class="text-3xs font-semibold text-brand-600 block"></span>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full py-4 bg-gradient-to-r from-brand-600 via-brand-500 to-blue-600 hover:from-brand-700 hover:to-blue-700 text-white font-black rounded-2xl shadow-xl shadow-brand-500/25 uppercase tracking-wider text-sm btn-animate active:scale-95 flex items-center justify-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up text-base"></i> Submit Log Entry
      </button>

    </form>

    <!-- Notification Banner -->
    <div id="op-banner" class="p-4 text-center font-extrabold text-xs uppercase hidden">
      <!-- Status message -->
    </div>

    <!-- Footer Sync Indicator -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 flex items-center justify-between text-2xs text-slate-400 font-bold uppercase tracking-wider flex-shrink-0 text-white">
      <div id="mobile-sync-status" class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <span>Local Database Ready</span>
      </div>
      <button onclick="exportMobileData()" class="text-brand-400 hover:text-brand-300 font-bold flex items-center gap-1"><i class="fa-solid fa-download"></i> Dump Backup</button>
    </footer>

  </div>

  <!-- Firebase JS SDK (Compat version for web CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-sync.js"></script>

  <!-- DB scripts -->
  <script src="paysheet-assets.js"></script>
  <script src="db.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
