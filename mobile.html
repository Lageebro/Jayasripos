<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaya Sri — Machine Operator Dashboard</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Logo.png">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js for Local Storage -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col min-h-[640px]">
    
    <!-- Top Header -->
    <header class="bg-gradient-to-tr from-slate-900 to-slate-800 p-6 text-white text-center relative flex-shrink-0">
      <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center shadow-lg shadow-brand-500/20 mx-auto mb-2 pulse-glow overflow-hidden">
        <img src="Logo.png" alt="Jaya Sri Logo" class="w-full h-full object-contain p-1">
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Operator Dashboard</h1>
      <span class="text-xs text-slate-400 font-medium">Jaya Sri Ice Cream Cone Factory</span>
    </header>

    <!-- Main Entry Form -->
    <form id="operator-form" onsubmit="submitOperatorLog(event)" class="p-6 space-y-6 flex-1 overflow-y-auto">
      
      <!-- 1. Operator Selection -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-user mr-1 text-slate-400"></i> Operator Name</label>
        <select id="op-worker-id" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
          <option value="">Choose your name...</option>
          <!-- Filled dynamically -->
        </select>
      </div>

      <!-- 2. Date Selection -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-calendar-day mr-1 text-slate-400"></i> Log Date</label>
        <input type="date" id="op-date" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
      </div>

      <!-- 3. Machine selection cards -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-desktop mr-1 text-slate-400"></i> Machine Used</label>
        <div class="grid grid-cols-3 gap-2">
          
          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition select-none bg-slate-50 text-slate-700" id="label-mach-01">
            <input type="radio" name="machineId" value="machine_01" required onclick="selectMachine('machine_01')" class="sr-only">
            <i class="fa-solid fa-microchip text-md mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">Jaya Sri 1.48</span>
          </label>

          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition select-none bg-slate-50 text-slate-700" id="label-mach-02">
            <input type="radio" name="machineId" value="machine_02" onclick="selectMachine('machine_02')" class="sr-only">
            <i class="fa-solid fa-microchip text-md mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">Jaya Sri 2.60</span>
          </label>

          <label class="border-2 border-slate-200 hover:border-brand-500 rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer transition select-none bg-slate-50 text-slate-700" id="label-mach-03">
            <input type="radio" name="machineId" value="machine_03" onclick="selectMachine('machine_03')" class="sr-only">
            <i class="fa-solid fa-microchip text-md mb-1 text-slate-400"></i>
            <span class="text-2xs font-extrabold tracking-tight">MRW 3.44</span>
          </label>

        </div>
      </div>

      <!-- 4. Boxes produced input -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-box-open mr-1 text-slate-400"></i> Boxes Produced</label>
        <div class="flex items-center">
          <button type="button" onclick="adjustBoxes(-1)" class="w-12 h-12 bg-slate-100 rounded-l-2xl border border-slate-200 text-slate-600 font-bold active:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-minus"></i></button>
          <input type="number" id="op-boxes" required min="1" oninput="triggerLiveCalculations()" class="w-full h-12 border-y border-slate-200 text-center font-bold text-slate-800 text-lg focus:outline-none bg-slate-50" placeholder="Enter boxes count">
          <button type="button" onclick="adjustBoxes(1)" class="w-12 h-12 bg-slate-100 rounded-r-2xl border border-slate-200 text-slate-600 font-bold active:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <!-- 5. Mixers count selector (1-7) -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-blender mr-1 text-slate-400"></i> Mixers Used</label>
        <div class="grid grid-cols-7 gap-1.5" id="mixers-grid">
          <!-- 1 to 7 select keys -->
        </div>
        <input type="hidden" id="op-mixers" required>
      </div>

      <!-- 6. Real-time estimated wage visual preview -->
      <div id="live-wage-preview" class="p-4 bg-blue-50 border border-blue-100 rounded-2xl text-center space-y-1 hidden">
        <span class="text-2xs font-bold text-blue-600 uppercase tracking-widest">Calculated Estimated Wage</span>
        <h4 id="live-wage-amount" class="text-xl font-extrabold text-blue-900">0 LKR</h4>
        <span id="live-wage-info" class="text-3xs text-blue-500 block"></span>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full py-4 bg-gradient-to-tr from-brand-600 to-blue-500 hover:from-brand-700 hover:to-blue-600 text-white font-extrabold rounded-2xl shadow-lg shadow-brand-500/20 uppercase tracking-wider text-sm btn-animate">
        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Submit Log Entry
      </button>

    </form>

    <!-- Notification Banner -->
    <div id="op-banner" class="p-4 text-center font-bold text-xs uppercase hidden">
      <!-- Status message -->
    </div>

    <!-- Footer Sync Indicator -->
    <footer class="bg-slate-50 border-t border-slate-100 p-4 flex items-center justify-between text-2xs text-slate-400 font-semibold uppercase tracking-wider flex-shrink-0">
      <div id="mobile-sync-status" class="flex items-center gap-1.5">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
        <span>Local Database Ready</span>
      </div>
      <button onclick="exportMobileData()" class="text-brand-600 hover:text-brand-700 font-bold"><i class="fa-solid fa-download mr-1"></i> Dump Backup</button>
    </footer>

  </div>

  <!-- Firebase JS SDK (Compat version for web CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-sync.js"></script>

  <!-- DB scripts -->
  <script src="db.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
